name: Build and Deploy Chatly

on:
  push:
    branches: [main, kilo/light-engine-1c5]
    tags: [v*]
  pull_request:
    branches: [main, kilo/light-engine-1c5]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present || true

  build-web:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-web
          path: dist/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: find . -type f | head -50

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            chatly-web/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}