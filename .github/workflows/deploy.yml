name: Build and Deploy Chatly

on:
  push:
    branches: [main, kilo/light-engine-1c5]
  pull_request:
    branches: [main, kilo/light-engine-1c5]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present || true

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-web
          path: dist/
          if-no-files-found: error

  build-electron:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 xvfb

      - name: Install dependencies
        run: npm install

      - name: Build web app first
        run: npm run build

      - name: Build Electron Linux
        run: |
          xvfb-run -a npx electron-builder --linux || true
        env:
          NODE_ENV: production

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-electron-linux
          path: release/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app first
        run: npm run build

      - name: Build Windows executable
        run: npx electron-builder --win || true
        env:
          NODE_ENV: production

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-windows
          path: release/
          if-no-files-found: ignore