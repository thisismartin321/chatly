name: Build and Deploy Chatly

on:
  push:
    branches: [main, kilo/light-engine-1c5]
    tags: [v*]
  pull_request:
    branches: [main, kilo/light-engine-1c5]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present || true

  build-web:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --include=optional

      - name: Build web app
        run: npm run build

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-web
          path: dist/
          if-no-files-found: error

  build-electron-linux:
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install system dependencies for Electron
        run: |
          echo "=== Installing system dependencies ==="
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 xvfb rpm flatpak flatpak-builder fuse3
          echo "=== System dependencies installed ==="

      - name: Install npm dependencies
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --include=optional

      - name: Build web app first
        run: npm run build

      - name: Build Electron Linux
        run: |
          echo "=== Starting Electron Linux build ==="
          xvfb-run -a npx electron-builder --linux --publish never
          echo "=== Electron Linux build completed ==="
        env:
          NODE_ENV: production

      - name: Upload Electron Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-electron-linux
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.flatpak
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          Remove-Item -Force -Recurse node_modules -ErrorAction SilentlyContinue
          npm install --include=optional

      - name: Build web app first
        run: npm run build

      - name: Build Windows executable
        run: |
          echo "=== Starting Windows build ==="
          npx electron-builder --win --publish never
          echo "=== Windows build completed ==="
        env:
          NODE_ENV: production

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: ignore

  build-linux-packages:
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          echo "=== Installing system dependencies ==="
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 xvfb rpm flatpak flatpak-builder fuse3
          echo "=== System dependencies installed ==="

      - name: Install npm dependencies
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --include=optional

      - name: Build web app first
        run: npm run build

      - name: Build Linux deb
        run: |
          echo "=== Building deb package ==="
          xvfb-run -a npx electron-builder --linux deb --publish never
          echo "=== deb build completed ==="
        env:
          NODE_ENV: production

      - name: Build Linux rpm
        run: |
          echo "=== Building rpm package ==="
          xvfb-run -a npx electron-builder --linux rpm --publish never
          echo "=== rpm build completed ==="
        env:
          NODE_ENV: production

      - name: Build AppImage
        run: |
          echo "=== Building AppImage ==="
          xvfb-run -a npx electron-builder --linux AppImage --publish never
          echo "=== AppImage build completed ==="
        env:
          NODE_ENV: production

      - name: Build Flatpak
        run: |
          echo "=== Building Flatpak ==="
          xvfb-run -a npx electron-builder --linux flatpak --publish never
          echo "=== Flatpak build completed ==="
        env:
          NODE_ENV: production

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: chatly-linux-packages
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.flatpak
          if-no-files-found: ignore

  build-android:
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          chmod +x latest/bin/sdkmanager
          echo "y" | latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;36.0.0"
          latest/bin/sdkmanager --licenses
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk

      - name: Install npm dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Cordova app directory
        run: |
          mkdir -p cordova-app
          cd cordova-app
          cordova create . com.chatly.app Chatly
          rm -rf www
          cp -r ../dist www

      - name: Add Android platform
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          cd cordova-app
          cordova platform add android

      - name: Install Java 17 for Android
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
          java -version

      - name: Build Android APK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          cd cordova-app
          cordova build android --release
        env:
          NODE_ENV: production
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: chatly-android
          path: cordova-app/platforms/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: [build-web, build-electron-linux, build-windows, build-linux-packages, build-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: find . -type f | head -50

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            chatly-web/**/*
            chatly-electron-linux/**/*
            chatly-windows/**/*
            chatly-linux-packages/**/*
            chatly-android/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}