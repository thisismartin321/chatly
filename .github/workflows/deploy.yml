name: Build and Deploy Chatly

on:
  push:
    branches: [main, kilo/light-engine-1c5]
  pull_request:
    branches: [main, kilo/light-engine-1c5]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present || true

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-web
          path: dist/
          if-no-files-found: error

  build-electron-linux:
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 xvfb

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Build Electron Linux
        run: |
          xvfb-run -a npx electron-builder --linux --dir || echo "Electron Linux build failed"
        env:
          NODE_ENV: production

      - name: Upload Electron Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-electron-linux
          path: release/
          if-no-files-found: ignore

  build-linux-packages:
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 xvfb rpm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Build Linux packages
        run: |
          xvfb-run -a npx electron-builder --linux deb || echo "deb build failed"
          xvfb-run -a npx electron-builder --linux rpm || echo "rpm build failed"
          xvfb-run -a npx electron-builder --linux AppImage || echo "AppImage build failed"
        env:
          NODE_ENV: production

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: chatly-linux-packages
          path: release/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Build Windows executable
        run: npx electron-builder --win --dir || echo "Windows build failed"
        env:
          NODE_ENV: production

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-windows
          path: release/
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: [build-web, build-electron-linux, build-linux-packages, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: find . -type f | head -50

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            chatly-web/**/*
            chatly-electron-linux/**/*
            chatly-linux-packages/**/*
            chatly-windows/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}