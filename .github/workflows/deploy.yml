name: Build and Deploy Chatly

on:
  push:
    branches: [main, kilo/light-engine-1c5]
  pull_request:
    branches: [main, kilo/light-engine-1c5]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present || true

  build-web:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --include=optional

      - name: Build web app
        run: npm run build

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-web
          path: dist/
          if-no-files-found: error

  build-electron-linux:
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system dependencies for Electron (Ubuntu 26.04 compatible)
        run: |
          echo "=== Installing system dependencies ==="
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 xvfb
          echo "=== System dependencies installed ==="

      - name: Install npm dependencies
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --include=optional

      - name: Check electron-builder config
        run: cat electron-builder.yml

      - name: Build web app first
        run: npm run build

      - name: Build Electron Linux
        run: |
          echo "=== Starting Electron Linux build ==="
          xvfb-run -a npx electron-builder --linux --publish never
          echo "=== Electron Linux build completed ==="
        env:
          NODE_ENV: production

      - name: Upload Electron Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-electron-linux
          path: release/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --include=optional

      - name: Build web app first
        run: npm run build

      - name: Build Windows executable
        run: |
          echo "=== Starting Windows build ==="
          npx electron-builder --win --publish never
          echo "=== Windows build completed ==="
        env:
          NODE_ENV: production

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-windows
          path: release/
          if-no-files-found: ignore

  build-linux-packages:
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system dependencies (Ubuntu 26.04 compatible)
        run: |
          echo "=== Installing system dependencies ==="
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 xvfb rpm
          echo "=== System dependencies installed ==="

      - name: Install npm dependencies
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --include=optional

      - name: Build web app first
        run: npm run build

      - name: Build Linux deb
        run: |
          echo "=== Building deb package ==="
          xvfb-run -a npx electron-builder --linux deb --publish never
          echo "=== deb build completed ==="
        env:
          NODE_ENV: production

      - name: Build Linux rpm
        run: |
          echo "=== Building rpm package ==="
          xvfb-run -a npx electron-builder --linux rpm --publish never
          echo "=== rpm build completed ==="
        env:
          NODE_ENV: production

      - name: Build AppImage
        run: |
          echo "=== Building AppImage ==="
          xvfb-run -a npx electron-builder --linux AppImage --publish never
          echo "=== AppImage build completed ==="
        env:
          NODE_ENV: production

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: chatly-linux-packages
          path: release/
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: [build-web, build-electron-linux, build-windows, build-linux-packages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: find . -type f | head -50

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            chatly-web/**/*
            chatly-electron-linux/**/*
            chatly-windows/**/*
            chatly-linux-packages/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}