name: Build and Deploy Chatly

on:
  push:
    branches: [main, kilo/light-engine-1c5]
  pull_request:
    branches: [main, kilo/light-engine-1c5]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present || true

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-web
          path: dist/

  build-electron:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 xvfb

      - name: Install dependencies
        run: npm install

      - name: Build web app first
        run: npm run build

      - name: Build Electron app (Linux)
        run: |
          xvfb-run -a npm run electron --linux --dir || true
        env:
          NODE_ENV: production

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-electron
          path: release/
          if-no-files-found: ignore

  build-linux-packages:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 xvfb rpm

      - name: Install dependencies
        run: npm install

      - name: Build web app first
        run: npm run build

      - name: Build Linux packages (deb, rpm, AppImage)
        run: |
          xvfb-run -a npm run deb || true
          xvfb-run -a npm run rpm || true
          xvfb-run -a npm run appimage || true
        env:
          NODE_ENV: production

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: chatly-linux
          path: release/
          if-no-files-found: ignore

  build-windows:
    needs: build-web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app first
        run: npm run build

      - name: Build Windows executable
        run: npm run exe
        env:
          NODE_ENV: production

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatly-windows
          path: release/
          if-no-files-found: ignore

  release:
    needs: [build-web, build-electron, build-linux-packages, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            chatly-web/**/*
            chatly-electron/**/*
            chatly-linux/**/*
            chatly-windows/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}